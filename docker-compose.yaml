services:
  llm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-local-chat-api
    restart: unless-stopped
    
    networks:
      - a-class-bridge
    
    dns:
      - 192.168.100.33
      - 8.8.8.8
      - 8.8.4.4
    
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    
    # ADD THIS:
    group_add:
      - video
    
    env_file:
      - .env
    
    environment:
      - LLM_MODEL_PATH="/mnt/llm_models/"
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.x86_64.json
      - PYTHONUNBUFFERED=1
      # Optional: helps RADV performance on AMD GPUs
      - GGML_VK_ALLOW_GRAPHICS_QUEUE=1
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./App:/app/App
      - ./main.py:/app/main.py
      - ./app.db:/app/app.db
      - /mnt/talha_linux/talha/Documents/DEv/Python:/models:ro
      - ./logs:/logs
      - ./.env:/app/.env:ro
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  a-class-bridge:
    external: true
    name: a-class-bridge